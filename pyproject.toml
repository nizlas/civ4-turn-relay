[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "civ4-turn-relay"
version = "0.1.0"
description = "Windows PBEM turn relay for Civilization IV: Beyond the Sword (Advanced Civ)."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [{ name = "Niclas Danielsson" }]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
    "mypy",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "pt(id): protocol test-matrix identifier from SYNC_PROTOCOL.md §13",
]

[tool.ruff]
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["civ4_turn_relay"]
files = ["src", "tests"]
